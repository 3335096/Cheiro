services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cheiro
      POSTGRES_PASSWORD: cheiro
      POSTGRES_DB: cheiro
    ports:
      - "5432:5432"
    volumes:
      - cheiro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheiro -d cheiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cheiro:cheiro@postgres:5432/cheiro
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cheiro:cheiro@postgres:5432/cheiro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep Linux node_modules inside the container; the Windows/macOS host has its own.
      - frontend_node_modules:/app/node_modules

volumes:
  cheiro_pg:
  frontend_node_modules: